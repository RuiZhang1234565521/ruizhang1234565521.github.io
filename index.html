<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <title>CMD计算器</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #222;
        font-family: Consolas, "Courier New", monospace;
        color: #00ff00;
        /* 页面背景居中容器 */
        display: flex;
        justify-content: center;
        padding-top: 30px;
        /* 靠上，不是垂直居中 */
        min-height: 100vh;
      }

      /* 计算器主容器 宽500 高600 */
      #container {
        width: 500px;
        height: 600px;
        display: flex;
        flex-direction: column;
      }

      /* 顶部按钮栏 */
      .top-bar {
        background: #000;
        border: 1px solid #333;
        padding: 6px 10px;
        margin-bottom: 8px;
        text-align: right;
      }

      #clearBtn {
        background: #222;
        color: #00ff00;
        border: 1px solid #00ff00;
        padding: 4px 8px;
        font-family: inherit;
        cursor: pointer;
      }

      #clearBtn:hover {
        background: #00ff00;
        color: #000;
      }

      /* 上方输出区域 */
      #output {
        flex: 1;
        background: #000;
        padding: 10px;
        overflow-y: auto;
        border: 1px solid #333;
        margin-bottom: 8px;
        white-space: pre-wrap;
      }

      .line {
        margin: 4px 0;
        cursor: pointer;
        padding: 2px 4px;
        border-radius: 2px;
      }

      .line:hover {
        background: #111;
      }

      .result {
        color: #fff;
      }

      .error {
        color: #ff4444;
      }

      /* 下方输入区域 */
      .bottom-wrap {
        background: #000;
        border: 1px solid #333;
        padding: 8px 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .prompt-symbol {
        margin-right: 6px;
      }

      #input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: #00ff00;
        font-family: inherit;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <!-- 顶部：清除历史按钮 -->
      <div class="top-bar">
        <button id="clearBtn">清除历史</button>
      </div>
      <div id="output"></div>
      <div class="bottom-wrap">
        <span class="prompt-symbol">></span>
        <input id="input" autocomplete="off" autofocus>
      </div>
    </div>
    <script>
      const output = document.getElementById('output');
      const input = document.getElementById('input');
      const clearBtn = document.getElementById('clearBtn');

      // 添加一行日志
      function addLine(text, isError = false) {
        const div = document.createElement('div');
        div.className = 'line';
        if (isError) {
          div.innerHTML = `<span class="error">${text}</span>`;
        } else {
          div.innerHTML = `<span class="result">${text}</span>`;
          // 点击这一行，提取算式填入输入框，并且保持焦点
          div.dataset.expr = text.split(' = ')[0];
          div.onclick = function() {
            input.value = this.dataset.expr;
            input.focus();
          }
        }
        output.appendChild(div);
        // 滚动到底部
        output.scrollTop = output.scrollHeight;
      }

      // 回车计算
      input.addEventListener('keydown', function(e) {
        if (e.key !== 'Enter') return;
        const expr = input.value.trim();
        if (!expr) {
          return;
        }
        try {
          const result = new Function(`return ${expr}`)();
          // 四舍五入保留5位小数，并去除末尾多余的0
          const fixedResult = Number(result.toFixed(5));
          addLine(`${expr} = ${fixedResult}`);
        } catch (err) {
          addLine(`错误：算式无效`, true);
        }
        input.value = '';
        input.focus(); // 回车计算后重新聚焦
      })

      // 清除历史按钮
      clearBtn.onclick = function() {
        output.innerHTML = '';
        input.focus(); // 点完清除自动回到输入框
      }

      // 页面内任意点击，都聚焦输入框
      document.addEventListener('click', function(e) {
        // 如果点击的本身就是输入框，不需要重复focus
        if (e.target !== input) {
          input.focus();
        }
      })
    </script>
  </body>
</html>
